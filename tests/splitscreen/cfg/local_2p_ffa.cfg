devmap mp/ffa3
wait 360
closemenu
wait 20
cmd team free
wait 80
cmd splitscreen_join 2 free
wait 160
cmd splitscreen_applyprofile 2
wait 80
cmd splitscreen_status
screenshot_png splitqa_local_2p_ffa_start
