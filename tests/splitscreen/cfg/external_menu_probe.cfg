set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 1
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set ui_splitScreenP3Input controller2
set ui_splitScreenP4Input controller3
set ui_splitScreenP1Name QA_Menu1
set ui_splitScreenP2Name QA_Menu2
set ui_splitScreenP3Name QA_Menu3
set ui_splitScreenP4Name QA_Menu4
set name QA_Menu1
devmap mp/ffa3
wait 360
closemenu
wait 20
cmd team free
wait 80
cmd splitscreen_join 2 free
wait 40
cmd splitscreen_join 3 free
wait 40
cmd splitscreen_join 4 free
wait 160
echo ExternalMenuProbe: READY_TOP
wait 240
splitui_status
screenshot_png splitqa_external_menu_top
echo ExternalMenuProbe: READY_PROFILE
wait 300
splitui_status
screenshot_png splitqa_external_menu_profile
echo ExternalMenuProbe: READY_CHARACTER
wait 240
splitui_status
ui_splitScreenP2Model
splitui_assert ui_splitScreenP2Model jedi_hf/head_a1|torso_a1|lower_a1
screenshot_png splitqa_external_menu_character
echo ExternalMenuProbe: READY_SABER_OPEN
wait 240
splitui_status
screenshot_png splitqa_external_menu_saber_open
echo ExternalMenuProbe: READY_SABER_CHANGE
wait 300
splitui_status
ui_splitScreenP2Saber1
ui_splitScreenP2Saber2
splitui_assert ui_splitScreenP2Saber1 single_1
splitui_assert ui_splitScreenP2Saber2 none
screenshot_png splitqa_external_menu_saber_changed
echo ExternalMenuProbe: READY_FORCE_OPEN
wait 240
splitui_status
screenshot_png splitqa_external_menu_force_open
echo ExternalMenuProbe: READY_FORCE_CHANGE
wait 300
splitui_status
ui_splitScreenP2ForcePowers
splitui_assert ui_splitScreenP2ForcePowers 7-1-333003000313003120
screenshot_png splitqa_external_menu_force_changed
echo ExternalMenuProbe: READY_KEYBOARD_OPEN
wait 240
splitui_status
screenshot_png splitqa_external_menu_keyboard_open
echo ExternalMenuProbe: READY_KEYBOARD_TYPE
wait 420
splitui_status
ui_splitScreenP2Name
splitui_assert ui_splitScreenP2Name QA_Menu2A
screenshot_png splitqa_external_menu_keyboard_done
echo ExternalMenuProbe: READY_CVARS
wait 360
splitui_status
screenshot_png splitqa_external_menu_cvars
echo ExternalMenuProbe: READY_CHEATS
wait 360
splitui_status
screenshot_png splitqa_external_menu_cheats
echo ExternalMenuProbe: READY_MULTI_PROFILE
wait 360
splitui_status
ui_splitScreenP2Model
ui_splitScreenP3Model
screenshot_png splitqa_external_menu_multi_profile
echo ExternalMenuProbe: READY_JOIN
wait 360
splitui_status
screenshot_png splitqa_external_menu_join
echo ExternalMenuProbe: READY_SPECTATE
wait 360
cmd splitscreen_assert_state 2 SPECTATOR 1
cmd splitscreen_status
splitui_status
screenshot_png splitqa_external_menu_spectate
splitscreen_topmenu 2
wait 40
echo ExternalMenuProbe: READY_CONTROLS
wait 800
splitui_status
splitui_assert ui_splitScreenMenuMode controls
screenshot_png splitqa_external_menu_controls
echo ExternalMenuProbe: READY_CONTROLS_BACK
wait 300
splitui_status
screenshot_png splitqa_external_menu_controls_back
echo ExternalMenuProbe: READY_CONSOLE
wait 300
splitui_status
screenshot_png splitqa_external_menu_console
wait 20
quit
