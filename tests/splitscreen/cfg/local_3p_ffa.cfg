set cl_splitScreen 1
set ui_splitScreenPlayerCount 3
set cl_splitScreenLocalCmds 1
set ui_splitScreenP1Name QA_P1
set ui_splitScreenP2Name QA_P2
set ui_splitScreenP3Name QA_P3
devmap mp/ffa3
wait 360
closemenu
wait 20
cmd team free
wait 80
cmd splitscreen_join 2 free
wait 60
cmd splitscreen_join 3 free
wait 160
cmd splitscreen_applyprofile 2
wait 40
cmd splitscreen_applyprofile 3
wait 80
cmd splitscreen_status
screenshot_png splitqa_local_3p_ffa_start
wait 20
cmd splitscreen_cmd 2 11000 0 0 0 1 127 0 0 0 0 0
cmd splitscreen_cmd 3 11000 0 8192 0 1 127 0 0 0 0 0
wait 8
cmd splitscreen_cmd 2 11050 0 4096 0 1 127 0 0 0 0 0
cmd splitscreen_cmd 3 11050 0 -8192 0 1 127 0 0 0 0 0
