set cl_splitScreen 1
set ui_splitScreenPlayerCount 2
set cl_splitScreenLocalCmds 1
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set ui_splitScreenP1Name QA_Route1
set ui_splitScreenP2Name QA_Route2
set ui_splitScreenP1Model kyle/default
set ui_splitScreenP2Model reborn/default
set ui_splitScreenTraceInput 1
devmap mp/ffa3
wait 360
closemenu
wait 20
cmd team free
wait 80
cmd splitscreen_join 2 free
wait 120
splitinput_route_status
splitscreen_setup 2
wait 60
splitinput_device_key controller1 RIGHTARROW 1
wait 4
splitinput_device_key controller1 RIGHTARROW 0
wait 30
echo SplitInputAssert after_controller
splitinput_route_status
splitinput_assert_model 1 kyle/default
splitinput_assert_model 2 reborn_new/default
splitinput_device_key keyboard RIGHTARROW 1
wait 4
splitinput_device_key keyboard RIGHTARROW 0
wait 30
echo SplitInputAssert after_keyboard
splitinput_route_status
splitinput_assert_model 1 jedi_hf/head_a1|torso_a1|lower_a1
splitinput_assert_model 2 reborn_new/default
splitinput_device_mouse 40 0
wait 20
echo SplitInputAssert after_mouse
splitinput_route_status
splitinput_assert_model 1 jedi_hf/head_a1|torso_a1|lower_a1
splitinput_assert_model 2 reborn_new/default
screenshot_png splitqa_input_routing_sim
condump splitqa_input_routing_sim_console.txt
wait 20
quit
