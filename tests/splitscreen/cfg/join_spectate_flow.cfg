set cl_splitScreen 1
set ui_splitScreenPlayerCount 4
set cl_splitScreenLocalCmds 1
set ui_splitScreenP1Input keyboard
set ui_splitScreenP2Input controller1
set ui_splitScreenP3Input controller2
set ui_splitScreenP4Input controller3
set name QA_State1
set ui_splitScreenP2Name QA_State2
set ui_splitScreenP3Name QA_State3
set ui_splitScreenP4Name QA_State4
devmap mp/ffa3
wait 360
closemenu
wait 20
cmd team free
wait 80
cmd splitscreen_join 2 free
wait 40
cmd splitscreen_join 3 free
wait 40
cmd splitscreen_join 4 free
wait 120
cmd splitscreen_assert_state 2 FREE 0
cmd splitscreen_assert_state 3 FREE 0
cmd splitscreen_assert_state 4 FREE 0
cmd splitscreen_spectate 3
wait 80
cmd splitscreen_assert_state 2 FREE 0
cmd splitscreen_assert_state 3 SPECTATOR 1
cmd splitscreen_assert_state 4 FREE 0
cmd splitscreen_join 3 free
wait 80
cmd splitscreen_assert_state 3 FREE 0
cmd splitscreen_spectate 2
wait 60
cmd splitscreen_assert_state 2 SPECTATOR 1
cmd splitscreen_join 2 free
wait 60
cmd splitscreen_assert_state 2 FREE 0
cmd splitscreen_spectate 4
wait 60
cmd splitscreen_assert_state 4 SPECTATOR 1
cmd splitscreen_join 4 free
wait 60
cmd splitscreen_assert_state 4 FREE 0
cmd splitscreen_status
screenshot_png splitqa_join_spectate_flow
condump splitqa_join_spectate_flow_console.txt
wait 20
quit
